<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">

<head>
    <title>Edit Book</title>
</head>

<body>

<div layout:fragment="content">

    <h1 class="mb-6 text-2xl font-bold">Edit Book</h1>

    <form th:action="@{/Catalogue/update/{isbn}(isbn=${book.isbn})}"
          th:object="${book}"
          method="post"
          class="max-w-2xl space-y-4 rounded-xl border border-slate-200 bg-white p-6">

        <!-- ISBN + Category -->
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">

            <div>
                <label class="mb-1 block text-sm font-medium">
                    ISBN
                </label>

                <input type="text"
                       th:field="*{isbn}"
                       readonly
                       class="w-full rounded-lg border border-slate-300 bg-slate-100 px-3 py-2 text-sm cursor-not-allowed">
            </div>

            <div>
                <label class="mb-1 block text-sm font-medium">
                    Category
                </label>

                <select th:field="*{category}"
                        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">

                    <option value="">Select category</option>

                    <option th:each="cat : ${categories}"
                            th:value="${cat.categoryId}"
                            th:text="${cat.name}">
                    </option>

                </select>
            </div>

        </div>

        <!-- Title -->
        <div>
            <label class="mb-1 block text-sm font-medium">
                Title
            </label>

            <input type="text"
                   th:field="*{title}"
                   required
                   class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
        </div>

        <!-- Author -->
        <div>
            <label class="mb-1 block text-sm font-medium">
                Author
            </label>

            <input type="text"
                   th:field="*{author}"
                   required
                   class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
        </div>

        <!-- Publisher -->
        <div>
            <label class="mb-1 block text-sm font-medium">
                Publisher
            </label>

            <input type="text"
                   th:field="*{publisher}"
                   class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
        </div>

        <!-- Edition -->
        <div>
            <label class="mb-1 block text-sm font-medium">
                Edition
            </label>

            <input type="text"
                   th:field="*{edition}"
                   class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
        </div>

        <!-- Description -->
        <div>
            <label class="mb-1 block text-sm font-medium">
                Description
            </label>

            <textarea th:field="*{description}"
                      rows="4"
                      class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"></textarea>
        </div>

        <!-- Actions -->
        <div class="flex gap-3">

            <button type="submit"
                    class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">
                Save Changes
            </button>

            <a th:href="@{/Catalogue}"
               class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium hover:bg-slate-100">
                Cancel
            </a>

        </div>

    </form>

</div>

</body>
</html>
