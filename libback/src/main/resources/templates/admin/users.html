<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/main}">

<head>
    <title>User Accounts</title>
</head>

<body>
    <div layout:fragment="content">

        <h1 class="mb-6 text-2xl font-bold">User Accounts</h1>

        <div th:replace="~{fragments/flash-message :: flash}"></div>

        <div class="grid grid-cols-1 gap-6 lg:grid-cols-3">

            <!-- CREATE FORM -->
            <form th:action="@{/admin/users/create}" method="post"
                class="h-fit space-y-4 rounded-xl border border-slate-200 bg-white p-6">
                <h2 class="font-semibold">Create Account</h2>

                <div>
                    <label class="mb-1 block-sm font-medium">Full Name</label>
                    <input name="name" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
                </div>

                <div>
                    <label class="mb-1 block text-sm font-medium">Username</label>
                    <input name="username" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
                </div>

                <div>
                    <label class="mb-1 block text-sm font-medium">Password</label>
                    <input name="password" type="password" minlength="8" required
                        class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
                    <p class="mt-1 text-xs text-slate-400">Minimum 8 characters.</p>
                </div>

                <div>
                    <label class="mb-1 block text-sm font-medium">Role</label>
                    <select name="role" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
                        <option value="SUPER_ADMIN">Super Admin</option>
                        <option value="LIBRARIAN">Librarian</option>
                    </select>

                </div>

                <button type="submit"
                    class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">
                    Create Account
                </button>
            </form>

            <!-- ACCOUNT LIST -->
            <div class="overflow-hidden rounded-xl border border-slate-200 bg-white lg:col-span-2">
                <table class="min-w-full divide-y divide-slate- text-sm">
                    <thead class="bg-slate-50 text-left text-xs uppercase tracking-wide text-slate-500">
                        <tr>
                            <th class="px-5 py-3">ID</th>
                            <th class="px-5 py-3">Name</th>
                            <th class="px-5 py-3">Username</th>
                            <th class="px-5 py-3">Role</th>
                            <th class="px-5 py-3">Status</th>
                            <th class="px-5 py-3 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        <tr th:each="user : ${users}" class="hover:bg-slate-50">
                            <td class="px-5 py-3" th:text="${user.userId}"></td>
                            <td class="px-5 py-3 font-medium" th:text="${user.name}"></td>
                            <td class="px-5 py-3" th:text="${user.username}"></td>
                            <td class="px-5 py-3">
                                <span
                                    class="inline-block rounded-full px-2.5 py-0.5 text-xs font-medium bg-purple-100 text-purple-700"
                                    th:text="${user.role}"></span>
                            </td>
                            <td class="px-5 py-3">
                                <span th:text="${user.active} ? 'Active' : 'Disabled'"
                                    th:classappend="${user.active} ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'"
                                    class="inline-block rounded-full px-2.5 py-0.5 text-xs font-medium"></span>
                            </td>
                            <td class="px-5 py-3 text-right">
                                <!-- hide toggle for your own account so you can't lock yourself out -->
                                <form th:if="${user.username != #authentication.name}"
                                    th:action="@{'/admin/users/toggle/' + ${user.userId}}" method="post" class="inline">
                                    <button type="submit" th:text="${user.active} ? 'Deactivate' : 'Activate'"
                                        class="text-sm hover:underline"
                                        th:classappend="${user.active} ? 'text-red-600' : 'text-green-600'"></button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="6" class="px-5 py-8 text-center text-slate-400">No accounts yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</body>

</html>
