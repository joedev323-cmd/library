<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">

<head>
    <title>Edit Member</title>
</head>

<body>

<div layout:fragment="content">

    <h1 class="mb-6 text-2xl font-bold">Edit Member</h1>

    <div th:if="${errorMessage}"
         class="mb-4 max-w-lg rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
         th:text="${errorMessage}">
    </div>

    <form th:action="@{'/admin/members/edit/' + ${member.memberId}}"
          th:object="${member}"
          method="post"
          class="max-w-lg space-y-4 rounded-xl border border-slate-200 bg-white p-6">

        <div>
            <label class="mb-1 block text-sm font-medium">
                Student ID
            </label>

            <input type="text"
                   th:field="*{memberId}"
                   readonly
                   class="w-full cursor-not-allowed rounded-lg border border-slate-300 bg-slate-100 px-3 py-2 text-sm">
        </div>

        <div>
            <label class="mb-1 block text-sm font-medium">
                Name
            </label>

            <input type="text"
                   th:field="*{name}"
                   required
                   class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
        </div>

        <div>
            <label class="mb-1 block text-sm font-medium">
                Email
            </label>

            <input type="email"
                   th:field="*{email}"
                   required
                   class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
        </div>

        <div>
            <label class="mb-1 block text-sm font-medium">
                Member Type
            </label>

            <select th:field="*{memberType}"
                    class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">

                <option th:each="type : ${T(com.example.libback.model.enums.MemberType).values()}"
                        th:value="${type}"
                        th:text="${type}">
                </option>

            </select>
        </div>

        <div class="flex gap-3">

            <button type="submit"
                    class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">
                Save Changes
            </button>

            <a th:href="@{/members}"
               class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium hover:bg-slate-100">
                Cancel
            </a>

        </div>

    </form>

</div>

</body>
</html>
