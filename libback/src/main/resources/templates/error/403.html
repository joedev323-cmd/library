<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Access Forbidden</title>
    <link rel="stylesheet" th:href="@{/css/tailwind.css}">
  </head>

  <body class="bg-gray-100 min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md text-center">

      <div class="flex justify-center mb-6">
        <div
          class="w-24 h-24 rounded-full bg-amber-50 flex items-center justify-center text-amber-600">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none"
            viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </div>
      </div>

      <h1
        class="text-9xl font-extrabold text-amber-600 tracking-widest">403</h1>

      <div
        class="bg-white rounded-xl shadow-sm p-8 mt-4 border border-gray-100">
        <h2 class="text-2xl font-medium text-gray-800 mb-2">The Restricted
          Section!</h2>
        <p class="text-gray-500 text-sm leading-relaxed mb-6">
          Shhh! Your library card doesn't have the required permissions or
          clearance levels to read this specific archive file.
        </p>

        <div class="space-y-2">
          <a th:href="@{/}"
            class="block w-full bg-purple-600 hover:bg-purple-700 text-white font-medium py-3 rounded-md text-sm transition shadow-sm">
            Return to Main Stacks
          </a>
          <button onclick="history.back()"
            class="block w-full bg-gray-50 hover:bg-gray-100 text-gray-600 font-medium py-3 rounded-md text-sm border border-gray-200 transition">
            Back Out Quietly
          </button>
        </div>
      </div>

      <p class="text-xs text-gray-400 mt-6">BiblioHub Catalog Management System
        &copy; 2026</p>
    </div>
  </body>
</html>
