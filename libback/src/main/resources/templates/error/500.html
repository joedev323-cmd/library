<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - System Error</title>
    <link rel="stylesheet" th:href="@{/css/tailwind.css}">
  </head>

  <body class="bg-gray-100 min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md text-center">

      <div class="flex justify-center mb-6">
        <div
          class="w-24 h-24 rounded-full bg-red-50 flex items-center justify-center text-red-500">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none"
            viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        </div>
      </div>

      <h1 class="text-9xl font-extrabold text-red-500 tracking-widest">500</h1>

      <div
        class="bg-white rounded-xl shadow-sm p-8 mt-4 border border-gray-100">
        <h2 class="text-2xl font-medium text-gray-800 mb-2">An unexpected plot
          twist!</h2>
        <p class="text-gray-500 text-sm leading-relaxed mb-6">
          Our digital printing press just suffered a major binding jam. The
          server encountered an internal narrative error trying to process your
          request.
        </p>

        <div class="space-y-2">
          <a th:href="@{/}"
            class="block w-full bg-purple-600 hover:bg-purple-700 text-white font-medium py-3 rounded-md text-sm transition shadow-sm">
            Return to Circulation Desk
          </a>
          <button onclick="window.location.reload()"
            class="block w-full bg-gray-50 hover:bg-gray-100 text-gray-600 font-medium py-3 rounded-md text-sm border border-gray-200 transition">
            Retry This Page
          </button>
        </div>
      </div>

      <div th:if="${exception}"
        class="mt-4 text-left bg-gray-200/50 rounded-lg p-3 text-xs text-gray-600 font-mono overflow-x-auto max-h-32">
        <span class="font-bold">Error Info:</span> <span
          th:text="${exception.message}">NullPointerException</span>
      </div>

      <p class="text-xs text-gray-400 mt-6">BiblioHub Catalog Management System
        &copy; 2026</p>
    </div>
  </body>
</html>
