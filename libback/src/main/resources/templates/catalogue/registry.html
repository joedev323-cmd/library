<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/main}">

<head>
    <title>Book Registry</title>
</head>

<body>

    <div layout:fragment="content">

        <div class="mb-6 flex items-center justify-between">

            <div>
                <h1 class="text-2xl font-bold">
                    Book Registry
                </h1>

                <p class="mt-1 text-sm text-slate-500">
                    Manage physical copies in the library collection.
                </p>
            </div>

        </div>

        <div th:replace="~{fragments/flash-message :: flash}"></div>
        <form th:action="@{/admin/catalog/registry}" method="get"
            class="mb-6 rounded-xl border border-slate-200 bg-white p-4">

            <div class="grid grid-cols-1 gap-4 md:grid-cols-4">

                <!-- SEARCH -->

                <div class="md:col-span-2">

                    <label class="mb-1 block text-sm font-medium text-slate-700">
                        Search
                    </label>

                    <input type="text" name="search" th:value="${search}"
                        placeholder="Accession, barcode, title or ISBN..." class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm
                           focus:border-indigo-500 focus:outline-none focus:ring-1
                           focus:ring-indigo-500" />

                </div>


                <!-- STATUS -->

                <div>

                    <label class="mb-1 block text-sm font-medium text-slate-700">
                        Status
                    </label>

                    <select name="status" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">

                        <option value="">
                            All statuses
                        </option>

                        <option th:each="status : ${availabilityStatuses}" th:value="${status}" th:text="${status}"
                            th:selected="${status == selectedStatus}">
                        </option>

                    </select>

                </div>


                <!-- CONDITION -->

                <div>

                    <label class="mb-1 block text-sm font-medium text-slate-700">
                        Condition
                    </label>

                    <select name="condition" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">

                        <option value="">
                            All conditions
                        </option>

                        <option th:each="condition : ${conditionStatuses}" th:value="${condition}"
                            th:text="${condition}" th:selected="${condition == selectedCondition}">
                        </option>

                    </select>

                </div>

            </div>


            <div class="mt-4 flex gap-2">

                <button type="submit" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm
                       font-medium text-white hover:bg-indigo-700">

                    Search

                </button>

                <a th:href="@{/admin/catalog/registry}" class="rounded-lg border border-slate-300 px-4 py-2
                       text-sm font-medium text-slate-600 hover:bg-slate-50">

                    Clear

                </a>

            </div>

        </form>

        <div class="overflow-hidden rounded-xl border border-slate-200 bg-white">

            <table class="min-w-full divide-y divide-slate-200 text-sm">

                <thead class="bg-slate-50 text-left text-xs uppercase tracking-wide text-slate-500">

                    <tr>
                        <th class="px-5 py-3">
                            Accession ID
                        </th>

                        <th class="px-5 py-3">
                            Book
                        </th>

                        <th class="px-5 py-3">
                            Copy
                        </th>

                        <th class="px-5 py-3">
                            Barcode
                        </th>

                        <th class="px-5 py-3">
                            Location
                        </th>

                        <th class="px-5 py-3">
                            Condition
                        </th>

                        <th class="px-5 py-3">
                            Status
                        </th>
                    </tr>

                </thead>

                <tbody class="divide-y divide-slate-100">

                    <tr th:each="accession : ${accessions}" class="hover:bg-slate-50">

                        <td class="px-5 py-3 font-mono text-xs" th:text="${accession.accessionId}">
                        </td>

                        <td class="px-5 py-3 font-medium" th:text="${accession.book.title}">
                        </td>

                        <td class="px-5 py-3" th:text="${accession.copyNumber}">
                        </td>

                        <td class="px-5 py-3 font-mono text-xs" th:text="${accession.barcode}">
                        </td>

                        <td class="px-5 py-3 text-slate-500" th:text="${accession.shelfLocation}">
                        </td>

                        <td class="px-5 py-3" th:text="${accession.conditionStatus}">
                        </td>

                        <td class="px-5 py-3">

                            <span
                                class="inline-block rounded-full bg-green-100 px-2.5 py-0.5 text-xs font-medium text-green-700"
                                th:text="${accession.availabilityStatus}">
                            </span>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(accessions)}">

                        <td colspan="7" class="px-5 py-8 text-center text-slate-400">

                            No physical copies registered yet.

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>
        <div th:if="${page.totalElements > 0}"
     class="flex items-center justify-between border-t border-slate-200
            bg-white px-5 py-4 text-sm">

    <!-- RESULT COUNT -->

    <div class="text-slate-500">

        Showing

        <span
                class="font-medium text-slate-700"
                th:text="${page.number * page.size + 1}">
        </span>

        to

        <span
                class="font-medium text-slate-700"
                th:text="${page.number * page.size + page.numberOfElements}">
        </span>

        of

        <span
                class="font-medium text-slate-700"
                th:text="${page.totalElements}">
        </span>

    </div>


    <!-- NAVIGATION -->

    <div class="flex items-center gap-1">

        <!-- PREVIOUS -->

        <a
                th:if="${page.hasPrevious()}"
                th:href="@{/admin/catalog/registry(
                    page=${page.number - 1},
                    search=${search},
                    status=${selectedStatus},
                    condition=${selectedCondition}
                )}"
                class="rounded-lg border border-slate-300 px-3 py-2
                       text-slate-600 hover:bg-slate-50">

            Previous

        </a>


        <!-- CURRENT PAGE -->

        <span
                class="rounded-lg bg-indigo-600 px-3 py-2
                       font-medium text-white"
                th:text="${page.number + 1}">
        </span>


        <!-- NEXT -->

        <a
                th:if="${page.hasNext()}"
                th:href="@{/admin/catalog/registry(
                    page=${page.number + 1},
                    search=${search},
                    status=${selectedStatus},
                    condition=${selectedCondition}
                )}"
                class="rounded-lg border border-slate-300 px-3 py-2
                       text-slate-600 hover:bg-slate-50">

            Next

        </a>

    </div>

</div>


    </div>

</body>

</html>
