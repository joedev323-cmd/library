<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

     <title th:text="|${book.title} - BiblioHub|">
    Book - BiblioHub
    </title>




    <link rel="stylesheet" th:href="@{/css/tailwind.css}">
</head>


<body class="min-h-screen bg-slate-50 text-slate-900">

    <nav class="border-b border-slate-200 bg-white">

        <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">

            <a th:href="@{/catalog}" class="flex items-center gap-3">

                <img th:src="@{/img/logo.png}" alt="BiblioHub" class="h-9 w-9">

                <span class="text-lg font-bold">
                    BiblioHub
                </span>

            </a>

            <a th:href="@{/login}"
                class="rounded-lg border border-slate-200 px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">
                Staff Login
            </a>

        </div>

    </nav>


    <main class="mx-auto max-w-5xl px-4 py-8 sm:px-6 lg:px-8">

        <!-- Breadcrumb -->
        <nav class="mb-6 text-sm text-slate-500">

            <a th:href="@{/catalog}" class="hover:text-indigo-600">
                Catalogue
            </a>

            <span class="mx-2">/</span>

            <span th:text="${book.title}">
                Book
            </span>

        </nav>


        <div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">

            <div class="grid grid-cols-1 lg:grid-cols-3">

                <!-- Cover placeholder -->
                <div class="flex min-h-80 items-center justify-center bg-indigo-50 p-8">

                    <svg class="h-28 w-28 text-indigo-200" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                        stroke-width="1">

                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 19.5A2.5 2.5 0 016.5 17H20" />

                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z" />

                    </svg>

                </div>


                <!-- Details -->
                <div class="p-6 sm:p-8 lg:col-span-2">

                    <p class="text-sm font-semibold uppercase tracking-wider text-indigo-600">
                        Book Details
                    </p>

                    <h1 class="mt-2 text-2xl font-bold tracking-tight sm:text-3xl" th:text="${book.title}">
                        Book Title
                    </h1>

                    <p class="mt-2 text-base text-slate-500">
                        by
                        <span th:text="${book.author}">
                            Author
                        </span>
                    </p>


                    <div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2">

                        <div>
                            <p class="text-xs font-medium uppercase tracking-wide text-slate-400">
                                ISBN
                            </p>

                            <p class="mt-1 font-mono text-sm" th:text="${book.isbn}">
                                ISBN
                            </p>
                        </div>


                        <div th:if="${book.publisher != null}">
                            <p class="text-xs font-medium uppercase tracking-wide text-slate-400">
                                Publisher
                            </p>

                            <p class="mt-1 text-sm" th:text="${book.publisher}">
                                Publisher
                            </p>
                        </div>


                        <div th:if="${book.edition != null}">
                            <p class="text-xs font-medium uppercase tracking-wide text-slate-400">
                                Edition
                            </p>

                            <p class="mt-1 text-sm" th:text="${book.edition}">
                                Edition
                            </p>
                        </div>


                        <div th:if="${book.category != null}">
                            <p class="text-xs font-medium uppercase tracking-wide text-slate-400">
                                Category
                            </p>

                            <p class="mt-1 text-sm" th:text="${book.category.name}">
                                Category
                            </p>
                        </div>

                    </div>


                    <!-- Description -->
                    <div th:if="${book.description != null && !book.description.isBlank()}"
                        class="mt-7 border-t border-slate-100 pt-6">

                        <h2 class="text-sm font-semibold">
                            Description
                        </h2>

                        <p class="mt-2 text-sm leading-6 text-slate-600" th:text="${book.description}">
                        </p>

                    </div>


                    <!-- Availability -->
                    <div class="mt-7 rounded-xl border border-slate-200 bg-slate-50 p-4">

                        <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">

                            <div>

                                <p class="text-sm font-semibold">
                                    Availability
                                </p>

                                <p class="mt-1 text-xs text-slate-500">
                                    Current physical copies in the library
                                </p>

                            </div>

                            <div>

                                <span th:if="${availableCount > 0}"
                                    class="inline-flex items-center gap-2 rounded-full bg-green-100 px-3 py-1.5 text-xs font-semibold text-green-700">

                                    <span class="h-2 w-2 rounded-full bg-green-500"></span>

                                    <span th:text="${availableCount}">
                                        1
                                    </span>

                                    available

                                </span>

                                <span th:unless="${availableCount > 0}"
                                    class="inline-flex items-center gap-2 rounded-full bg-red-100 px-3 py-1.5 text-xs font-semibold text-red-700">

                                    <span class="h-2 w-2 rounded-full bg-red-500"></span>

                                    Currently unavailable

                                </span>

                            </div>

                        </div>

                    </div>



                    <div class="mt-6">

                        <a th:href="@{/}"
                            class="inline-flex items-center rounded-lg border border-slate-200 bg-white px-4 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-50">

                            ← Back to public

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <footer class="mt-12 border-t border-slate-200 bg-white">

        <div class="mx-auto max-w-7xl px-4 py-6 text-center text-xs text-slate-400">
            © BiblioHub Library
        </div>

    </footer>

</body>

</html>
