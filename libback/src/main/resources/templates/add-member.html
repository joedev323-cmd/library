<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register New Member - BiblioHub</title>
    <link rel="stylesheet" th:href="@{/css/tailwind.css}" />
  </head>

  <body class="bg-gray-100 min-h-screen flex">
    <aside
      class="w-64 bg-white shadow-md hidden md:flex flex-col justify-between"
    >
      <div>
        <div class="p-6 border-b border-gray-100">
          <h1 class="text-2xl font-light text-gray-800 flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-purple-600 block"></span>
            Biblio<span class="font-semibold text-purple-600">Hub</span>
          </h1>
        </div>
        <nav class="p-4 space-y-1">
          <a
            th:href="@{/dashboard}"
            class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg text-gray-600 hover:bg-gray-50 hover:text-purple-600 transition"
          >
            <svg
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2V6z"
              />
            </svg>
            Dashboard
          </a>

          <a
            th:href="@{/Catalogue}"
            class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg text-gray-600 hover:bg-gray-50 hover:text-purple-600 transition"
          >
            <svg
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"
              />
            </svg>
            Book Catalog
          </a>

          <a
            th:href="@{/circulation}"
            class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg text-gray-600 hover:bg-gray-50 hover:text-purple-600 transition"
          >
            <svg
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"
              />
            </svg>
            Issue / Returns
          </a>

          <a
            th:href="@{/members}"
            class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg bg-purple-50 text-purple-600 transition"
          >
            <svg
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.114-1.28.319-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"
              />
            </svg>
            Members
          </a>

          <a
            th:href="@{/reports}"
            class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg text-gray-600 hover:bg-gray-50 hover:text-purple-600 transition"
          >
            <svg
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
              />
            </svg>
            Reports
          </a>
        </nav>
      </div>

      <div class="p-4 border-t border-gray-100">
        <form th:action="@{/logout}" method="post">
          <button
            type="submit"
            class="w-full flex items-center gap-3 px-4 py-3 text-sm font-medium text-red-600 rounded-lg hover:bg-red-50 transition"
          >
            <svg
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
              />
            </svg>
            Log Out
          </button>
        </form>
      </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 overflow-x-hidden">
      <header
        class="bg-white shadow-sm h-16 flex items-center justify-between px-6 z-10"
      >
        <div class="flex items-center gap-4">
          <h2 class="text-xl font-semibold text-gray-800">
            Library Administration
          </h2>
        </div>

        <div class="flex items-center gap-4">
          <div class="text-right hidden sm:block">
            <p
              class="text-sm font-medium text-gray-800"
              th:text="${#authentication.name}"
            >
              Librarian
            </p>
            <p class="text-xs text-gray-500">Staff Dashboard</p>
          </div>
          <div
            class="w-10 h-10 rounded-full bg-purple-600 flex items-center justify-center text-white font-medium"
          >
            <svg
              class="h-6 w-6"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              />
            </svg>
          </div>
        </div>
      </header>

      <main class="p-6 space-y-6 flex-1 overflow-y-auto">
        <div
          class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden max-w-2xl mx-auto"
        >
          <div
            class="px-6 py-5 border-b border-gray-100 flex items-center justify-between"
          >
            <h3 class="text-lg font-medium text-gray-800">
              Register New Member
            </h3>
          </div>
          <div
            th:if="${errorMessage}"
            class="mb-4 p-4 bg-red-50 text-red-700 rounded-lg text-sm border border-red-200"
          >
            <p th:text="${errorMessage}"></p>
          </div>
          <form
            th:action="@{/admin/add/member}"
            th:object="${borrower}"
            method="POST"
            class="p-6 space-y-4"
          >
            <input
              type="hidden"
              th:name="${_csrf.parameterName}"
              th:value="${_csrf.token}"
            />
            <div>
              <label
                for="borrowerId"
                class="block text-sm font-medium text-gray-700 mb-1"
                >Card ID / Account No</label
              >
              <input
                type="text"
                id="borrowerId"
                th:field="*{borrowerId}"
                placeholder="M-000"
                required
                class="w-full px-3 py-2 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 font-mono text-purple-600"
              />
            </div>

            <div>
              <label
                for="name"
                class="block text-sm font-medium text-gray-700 mb-1"
                >Full Name</label
              >
              <input
                type="text"
                id="name"
                th:field="*{name}"
                placeholder="Testing Account Name"
                required
                class="w-full px-3 py-2 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 text-gray-800"
              />
            </div>

            <div>
              <label
                for="email"
                class="block text-sm font-medium text-gray-700 mb-1"
                >Contact Email Address</label
              >
              <input
                type="email"
                id="email"
                th:field="*{email}"
                placeholder="test@example.com"
                required
                class="w-full px-3 py-2 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 text-gray-800"
              />
            </div>

            <div>
              <label
                for="memberType"
                class="block text-sm font-medium text-gray-700 mb-1"
                >Membership Class Type</label
              >
              <select
                id="memberType"
                th:field="*{memberType}"
                class="w-full px-3 py-2 border border-gray-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 bg-white text-gray-800"
              >
                <option value="STUDENT">Student</option>
                <option value="faculty">Staff / Faculty</option>
                <option value="regular">Super Admin</option>
              </select>
            </div>

            <div
              class="pt-4 flex items-center justify-end gap-3 border-t border-gray-100"
            >
              <a
                th:href="@{/members}"
                class="px-4 py-2 text-xs font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded transition text-center shadow-sm"
              >
                Cancel
              </a>
              <button
                type="submit"
                class="bg-purple-600 hover:bg-purple-700 text-white text-xs font-medium px-4 py-2 rounded transition shadow-sm text-center"
              >
                Save Registration
              </button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </body>
</html>
