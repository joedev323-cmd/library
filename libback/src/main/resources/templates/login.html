<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BiblioHub - Staff Portal</title>
    <link rel="stylesheet" th:href="@{/css/tailwind.css}">
  </head>
  <body
    class="bg-gray-50 min-h-screen flex items-center justify-center px-4 font-sans antialiased">
    <div class="w-full max-w-md space-y-6">

      <div class="text-center space-y-2">
        <div class="flex items-center justify-center gap-2">
          <span class="w-3 h-3 rounded-full bg-purple-600 block"></span>
          <span class="text-3xl font-light text-gray-800 tracking-tight">
            Biblio<span class="font-semibold text-purple-600">Hub</span>
          </span>
        </div>
        <p
          class="text-xs text-gray-400 font-medium uppercase tracking-wider">Internal
          Asset Framework</p>
      </div>

      <div
        class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 sm:p-10">
        <div class="flex justify-center mb-6">
          <div
            class="w-16 h-16 rounded-full bg-purple-50 border border-purple-100 flex items-center justify-center text-purple-600">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none"
              viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round"
                stroke-width="1.5"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 002-2V9a2 2 0 00-2-2h-1C11 3 13 3 12 3S7 3 6 7H5a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a1 1 0 11-2 0 1 1 0 012 0z" />
            </svg>
          </div>
        </div>

        <h2 class="text-center text-xl text-gray-800 font-medium mb-6">Staff
          Authentication</h2>

        <form th:action="@{/login}" method="post" class="space-y-4">
          <div>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Username or Staff ID"
              class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 transition"
              required>
          </div>

          <div>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Password"
              class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 transition"
              required>
          </div>

          <div class="flex items-center justify-between text-xs font-medium">
            <label
              class="flex items-center gap-2 cursor-pointer text-gray-500 select-none">
              <input
                type="checkbox"
                id="remember-me"
                name="remember-me"
                class="h-4 w-4 rounded border-gray-300 text-purple-600 focus:ring-purple-500 accent-purple-600">
              <span>Remember Identity</span>
            </label>

            <a href="#"
              class="text-purple-600 hover:text-purple-700 transition">
              Forgot Password?
            </a>
          </div>

          <button
            type="submit"
            class="w-full bg-purple-600 hover:bg-purple-700 text-white font-medium py-3 rounded-lg mt-2 transition shadow-sm text-sm">
            Access Console
          </button>
        </form>

        <div th:if="${param.error}"
          class="mt-4 p-3 bg-rose-50 border border-rose-100 rounded-lg text-rose-600 text-center text-xs font-medium">
          Invalid credentials or access parameters.
        </div>

        <div th:if="${param.logout}"
          class="mt-4 p-3 bg-green-50 border border-green-100 rounded-lg text-green-700 text-center text-xs font-medium">
          Session safely terminated.
        </div>

      </div>

      <div class="text-center">
        <a th:href="@{/}"
          class="text-xs text-gray-400 hover:text-gray-600 transition inline-flex items-center gap-1">
          ← Return to Public Catalog Search
        </a>
      </div>

    </div>
  </body>
</html>
