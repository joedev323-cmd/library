<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<div th:fragment="mobile-nav">

    <!-- MOBILE HEADER -->
    <header class="sticky top-0 z-40 border-b border-slate-200 bg-white lg:hidden">

        <div class="flex h-16 items-center justify-between px-4">

            <!-- Logo -->
            <a th:href="@{/dashboard}"
               class="flex items-center gap-2">

                <img th:src="@{/img/logo.png}"
                     alt="BiblioHub"
                     class="h-8 w-8">

                <span class="text-lg font-bold tracking-tight text-slate-900">
                    BiblioHub
                </span>

            </a>

            <!-- Menu Button -->
            <button type="button"
                    id="mobile-menu-button"
                    aria-controls="mobile-menu"
                    aria-expanded="false"
                    class="inline-flex h-10 w-10 items-center justify-center rounded-lg text-slate-600 transition hover:bg-slate-100 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">

                <span class="sr-only">
                    Open navigation menu
                </span>

                <!-- Menu Icon -->
                <svg id="mobile-menu-open-icon"
                     class="h-6 w-6"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor"
                     stroke-width="2">

                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M4 6h16M4 12h16M4 18h16"/>

                </svg>

                <!-- Close Icon -->
                <svg id="mobile-menu-close-icon"
                     class="hidden h-6 w-6"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor"
                     stroke-width="2">

                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M6 18L18 6M6 6l12 12"/>

                </svg>

            </button>

        </div>


        <!-- MOBILE MENU -->
        <div id="mobile-menu"
             class="hidden border-t border-slate-200 bg-white">

            <nav class="space-y-1 px-4 py-4">

                <!-- Dashboard -->
                <a th:href="@{/dashboard}"
                   class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-700 transition hover:bg-slate-100 hover:text-slate-900">

                    <svg class="h-5 w-5 text-slate-400"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor"
                         stroke-width="2">

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M3 12l9-9 9 9M5 10v10h14V10"/>

                    </svg>

                    Dashboard

                </a>


                <!-- Circulation -->
                <a th:href="@{/circulation}"
                   class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-700 transition hover:bg-slate-100 hover:text-slate-900">

                    <svg class="h-5 w-5 text-slate-400"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor"
                         stroke-width="2">

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M4 4v5h5M20 20v-5h-5M5.5 9A7 7 0 0117 6.5L20 9M18.5 15A7 7 0 017 17.5L4 15"/>

                    </svg>

                    Circulation

                </a>


                <!-- Catalogue -->
                <a th:href="@{/Catalogue}"
                   class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-700 transition hover:bg-slate-100 hover:text-slate-900">

                    <svg class="h-5 w-5 text-slate-400"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor"
                         stroke-width="2">

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M4 5a2 2 0 012-2h12a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V5z"/>

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M8 7h8M8 11h8M8 15h5"/>

                    </svg>

                    Catalogue

                </a>


                <!-- Add Book -->
                <a th:href="@{/admin/catalog/add}"
                   class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-700 transition hover:bg-slate-100 hover:text-slate-900">

                    <svg class="h-5 w-5 text-slate-400"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor"
                         stroke-width="2">

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M12 4v16m8-8H4"/>

                    </svg>

                    Add Book

                </a>


                <!-- Categories -->
                <a th:href="@{/admin/categories}"
                   class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-700 transition hover:bg-slate-100 hover:text-slate-900">

                    <svg class="h-5 w-5 text-slate-400"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor"
                         stroke-width="2">

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M4 6h16M4 12h16M4 18h16"/>

                    </svg>

                    Categories

                </a>


                <!-- Members -->
                <a th:href="@{/members}"
                   class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-slate-700 transition hover:bg-slate-100 hover:text-slate-900">

                    <svg class="h-5 w-5 text-slate-400"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor"
                         stroke-width="2">

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/>

                        <circle cx="9"
                                cy="7"
                                r="4"/>

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M22 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>

                    </svg>

                    Members

                </a>


                <!-- Divider -->
                <div class="my-3 border-t border-slate-100"></div>


                <!-- Logout -->
                <form th:action="@{/logout}"
                      method="post">

                    <button type="submit"
                            class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left text-sm font-medium text-red-600 transition hover:bg-red-50">

                        <svg class="h-5 w-5"
                             fill="none"
                             viewBox="0 0 24 24"
                             stroke="currentColor"
                             stroke-width="2">

                            <path stroke-linecap="round"
                                  stroke-linejoin="round"
                                  d="M17 16l4-4m0 0l-4-4m4 4H7"/>

                            <path stroke-linecap="round"
                                  stroke-linejoin="round"
                                  d="M3 21V3a2 2 0 012-2h7"/>

                        </svg>

                        Sign out

                    </button>

                </form>

            </nav>

        </div>

    </header>


    <!-- MOBILE MENU SCRIPT -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {

            const button = document.getElementById('mobile-menu-button');
            const menu = document.getElementById('mobile-menu');
            const openIcon = document.getElementById('mobile-menu-open-icon');
            const closeIcon = document.getElementById('mobile-menu-close-icon');

            if (!button || !menu) {
                return;
            }

            button.addEventListener('click', function () {

                const isOpen = !menu.classList.contains('hidden');

                menu.classList.toggle('hidden');

                openIcon.classList.toggle('hidden', !isOpen);
                closeIcon.classList.toggle('hidden', isOpen);

                button.setAttribute(
                    'aria-expanded',
                    String(!isOpen)
                );

            });

        });
    </script>

</div>

</html>
