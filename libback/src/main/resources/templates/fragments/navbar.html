<!DOCTYPE html>
<html lang="en"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <body>

        <div th:fragment="navbar"
            class="flex w-full items-center justify-between">

            <!-- LEFT -->
            <div class="flex items-center gap-3">

                <!-- MOBILE MENU BUTTON -->
                <button type="button"
                    onclick="toggleMobileNav()"
                    class="inline-flex h-10 w-10 items-center justify-center rounded-lg
                       border border-slate-200 bg-white text-slate-600
                       hover:bg-slate-50 lg:hidden"
                    aria-label="Open navigation">

                    <svg class="h-5 w-5"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="2">

                        <path stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M4 6h16M4 12h16M4 18h16" />

                    </svg>

                </button>

                <div>
                    <p
                        class="text-xs font-semibold uppercase tracking-wider text-purple-600">
                        Library Management
                    </p>

                    <h1
                        class="mt-1 text-xl font-semibold tracking-tight text-slate-900 sm:text-2xl"
                        th:text="${pageTitle != null ? pageTitle : 'Dashboard'}">
                        Dashboard
                    </h1>
                </div>

            </div>

            <!-- RIGHT -->
            <div class="flex items-center gap-3">

                <div class="hidden text-right sm:block">

                    <p class="text-sm font-semibold text-slate-800"
                        sec:authentication="name">
                        Librarian
                    </p>

                    <p class="text-xs text-slate-500"
                        sec:authorize="hasRole('SUPER_ADMIN')">
                        Super Admin
                    </p>

                    <p class="text-xs text-slate-500"
                        sec:authorize="hasRole('LIBRARIAN')">
                        Librarian
                    </p>

                </div>

                <div class="flex h-10 w-10 items-center justify-center
                    rounded-full bg-purple-100 text-purple-700">

                    <svg class="h-5 w-5"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="2">

                        <path stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M16 7a4 4 0 11-8 0 4 4 0
                         018 0zM12 14a7 7 0 00-7 7h14a7
                         7 0 00-7-7z" />

                    </svg>

                </div>

            </div>

        </div>

    </body>
</html>
