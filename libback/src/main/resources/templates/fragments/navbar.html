<header
    th:fragment="navbar"
    class="h-16 bg-white border-b border-gray-200
           flex items-center justify-between px-6">

    <div>
        <h1 class="text-lg font-semibold text-gray-800"
            th:text="${pageTitle != null ? pageTitle : 'Library Administration'}">
            Library Administration
        </h1>

        <p class="text-xs text-gray-500 hidden sm:block"
           th:if="${pageSubtitle != null}"
           th:text="${pageSubtitle}">
            Library management
        </p>
    </div>

    <div class="flex items-center gap-3">

        <div class="text-right hidden sm:block">

            <p class="text-sm font-medium text-gray-800"
               th:text="${username != null ? username : 'Librarian'}">
                Librarian
            </p>

            <p class="text-xs text-gray-500">
                Staff
            </p>

        </div>

        <div class="w-9 h-9 rounded-full
                    bg-purple-600
                    flex items-center justify-center
                    text-white">

            <svg class="w-5 h-5"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke="currentColor"
                 stroke-width="2">

                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M16 7a4 4 0 11-8 0
                         4 4 0 018 0z
                         M12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>

        </div>

    </div>

</header>
