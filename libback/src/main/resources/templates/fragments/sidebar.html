<aside
    th:fragment="sidebar"
    class="w-64 bg-white border-r border-gray-200 hidden md:flex flex-col">

    <!-- Brand -->
    <div class="h-16 px-6 flex items-center border-b border-gray-100">
        <a th:href="@{/dashboard}"
           class="flex items-center gap-2">

            <span class="w-3 h-3 rounded-full bg-purple-600"></span>

            <span class="text-xl font-light text-gray-800">
                Biblio<span class="font-semibold text-purple-600">Hub</span>
            </span>
        </a>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-4 py-6 space-y-6">

        <!-- Overview -->
        <div>
            <p class="px-3 mb-2 text-xs font-semibold
                      uppercase tracking-wider text-gray-400">
                Overview
            </p>

            <a th:href="@{/dashboard}"
               class="flex items-center gap-3 px-3 py-2.5
                      rounded-lg text-sm font-medium
                      text-gray-600
                      hover:bg-purple-50 hover:text-purple-600
                      transition">

                <svg class="w-5 h-5"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor"
                     stroke-width="2">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6z
                             M14 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2V6z"/>
                </svg>

                Dashboard
            </a>
        </div>

        <!-- Library -->
        <div>
            <p class="px-3 mb-2 text-xs font-semibold
                      uppercase tracking-wider text-gray-400">
                Library
            </p>

            <div class="space-y-1">

                <a th:href="@{/Catalogue}"
                   class="flex items-center gap-3 px-3 py-2.5
                          rounded-lg text-sm font-medium
                          text-gray-600
                          hover:bg-gray-50 hover:text-purple-600
                          transition">
                    <span>📚</span>
                    <span>Book Catalog</span>
                </a>

                <a th:href="@{/circulation}"
                   class="flex items-center gap-3 px-3 py-2.5
                          rounded-lg text-sm font-medium
                          text-gray-600
                          hover:bg-gray-50 hover:text-purple-600
                          transition">
                    <span>↔</span>
                    <span>Circulation</span>
                </a>

                <a th:href="@{/members}"
                   class="flex items-center gap-3 px-3 py-2.5
                          rounded-lg text-sm font-medium
                          text-gray-600
                          hover:bg-gray-50 hover:text-purple-600
                          transition">
                    <span>👥</span>
                    <span>Members</span>
                </a>
            </div>
        </div>

        <!-- Management -->
        <div>
            <p class="px-3 mb-2 text-xs font-semibold
                      uppercase tracking-wider text-gray-400">
                Management
            </p>

            <div class="space-y-1">

                <a th:href="@{/admin/categories}"
                   class="flex items-center gap-3 px-3 py-2.5
                          rounded-lg text-sm font-medium
                          text-gray-600
                          hover:bg-gray-50 hover:text-purple-600
                          transition">
                    <span>▦</span>
                    <span>Categories</span>
                </a>

                <a th:href="@{/admin/catalog/registry}"
                   class="flex items-center gap-3 px-3 py-2.5
                          rounded-lg text-sm font-medium
                          text-gray-600
                          hover:bg-gray-50 hover:text-purple-600
                          transition">
                    <span>▤</span>
                    <span>Blueprint Registry</span>
                </a>

                <a th:href="@{/reports}"
                   class="flex items-center gap-3 px-3 py-2.5
                          rounded-lg text-sm font-medium
                          text-gray-600
                          hover:bg-gray-50 hover:text-purple-600
                          transition">
                    <span>▥</span>
                    <span>Reports</span>
                </a>
            </div>
        </div>

    </nav>

    <!-- Logout -->
    <div class="p-4 border-t border-gray-100">

        <form th:action="@{/logout}" method="post">

            <button type="submit"
                    class="w-full flex items-center gap-3
                           px-3 py-2.5 rounded-lg
                           text-sm font-medium text-red-600
                           hover:bg-red-50 transition">

                <svg class="w-5 h-5"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor"
                     stroke-width="2">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M17 16l4-4m0 0l-4-4m4 4H7"/>
                </svg>

                Log Out
            </button>

        </form>
    </div>

</aside>
