<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>

    <div th:fragment="sidebar" class="flex h-full flex-col">

        <!-- BRAND -->
        <div class="flex h-20 items-center border-b border-slate-100 px-6">

            <a th:href="@{/dashboard}" class="flex items-center gap-3">

                <span class="flex h-10 w-10 items-center justify-center
                         rounded-xl bg-purple-600 text-white shadow-sm">

                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">

                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5
                             7.5 5S4.168 5.477 3 6.253v13C4.168 18.477
                             5.754 18 7.5 18s3.332.477 4.5 1.253
                             m0-13C13.168 5.477 14.754 5
                             16.5 5c1.747 0 3.332.477 4.5 1.253v13
                             C19.832 18.477 18.247 18 16.5 18
                             c-1.746 0-3.332.477-4.5 1.253" />

                    </svg>

                </span>

                <span class="text-xl font-semibold tracking-tight">
                    Biblio<span class="text-purple-600">Hub</span>
                </span>

            </a>

        </div>


        <!-- NAVIGATION -->
        <nav class="flex-1 px-4 py-6 overflow-y-auto">

            <!-- LIBRARY -->
            <p class="mb-3 px-3 text-xs font-semibold uppercase
                  tracking-wider text-slate-400">
                Library
            </p>

            <div class="space-y-1">

                <!-- Dashboard -->
                <a th:href="@{/dashboard}" class="group flex items-center gap-3 rounded-xl px-3 py-3
                      text-sm font-medium text-slate-600 transition
                      hover:bg-slate-50 hover:text-purple-700">

                    <svg class="h-5 w-5 text-slate-400 group-hover:text-purple-600" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2">

                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1
                             0 001 1h3m10-11l2 2m-2-2v10a1 1 0
                             01-1 1h-3m-6 0h6" />

                    </svg>

                    <span>Dashboard</span>

                </a>


                <!-- Catalogue -->
                <a th:href="@{/Catalogue}" class="group flex items-center gap-3 rounded-xl px-3 py-3
                      text-sm font-medium text-slate-600 transition
                      hover:bg-slate-50 hover:text-purple-700">

                    <svg class="h-5 w-5 text-slate-400 group-hover:text-purple-600" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2">

                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5
                             7.5 5S4.168 5.477 3 6.253v13C4.168
                             18.477 5.754 18 7.5 18s3.332.477
                             4.5 1.253m0-13C13.168 5.477
                             14.754 5 16.5 5c1.747 0 3.332.477
                             4.5 1.253v13" />

                    </svg>

                    <span>Catalog</span>

                </a>


                <!-- Circulation -->
                <a th:href="@{/circulation}" class="group flex items-center gap-3 rounded-xl px-3 py-3
                      text-sm font-medium text-slate-600 transition
                      hover:bg-slate-50 hover:text-purple-700">

                    <svg class="h-5 w-5 text-slate-400 group-hover:text-purple-600" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2">

                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4
                             M16 17H4m0 0l4 4m-4-4l4-4" />

                    </svg>

                    <span>Issue &amp; Returns</span>

                </a>


                <!-- Members -->
                <a th:href="@{/members}" class="group flex items-center gap-3 rounded-xl px-3 py-3
                      text-sm font-medium text-slate-600 transition
                      hover:bg-slate-50 hover:text-purple-700">

                    <svg class="h-5 w-5 text-slate-400 group-hover:text-purple-600" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2">

                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857
                             M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857
                             M7 20H2v-2a3 3 0 015.356-1.857
                             M7 20v-2c0-.656.114-1.28.319-1.857
                             m0 0a5.002 5.002 0 019.288 0
                             M15 7a3 3 0 11-6 0 3 3 0 016 0z" />

                    </svg>

                    <span>Members</span>

                </a>

            </div>
            <!-- Issue & Returns -->
            <a th:href="@{/circulation}" class="group flex items-center gap-3 rounded-xl px-3 py-3
          text-sm font-medium text-slate-600 transition
          hover:bg-slate-50 hover:text-purple-700">

                <svg class="h-5 w-5 text-slate-400 group-hover:text-purple-600" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">

                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4
                 M16 17H4m0 0l4 4m-4-4l4-4" />

                </svg>

                <span>Issue &amp; Returns</span>

            </a>


            <!-- Renew Loan -->
            <a th:href="@{/circulation/renew}" class="group flex items-center gap-3 rounded-xl px-3 py-3
          text-sm font-medium text-slate-600 transition
          hover:bg-slate-50 hover:text-purple-700">

                <svg class="h-5 w-5 text-slate-400 group-hover:text-purple-600" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">

                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h5
                 M20 20v-5h-5
                 M5.5 9A7 7 0 0117 6.5L20 9
                 M18.5 15A7 7 0 017 17.5L4 15" />

                </svg>

                <span>Renew Loans</span>

            </a>


            <!-- Payments -->
            <a th:href="@{/payments}" class="group flex items-center gap-3 rounded-xl px-3 py-3
          text-sm font-medium text-slate-600 transition
          hover:bg-slate-50 hover:text-purple-700">

                <svg class="h-5 w-5 text-slate-400 group-hover:text-purple-600" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">

                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h2m3 0h2m-9 4h12
                 a2 2 0 002-2V7a2 2 0 00-2-2H5
                 a2 2 0 00-2 2v10a2 2 0 002 2z" />

                </svg>

                <span>Payments</span>

            </a>



            <!-- ADMINISTRATION -->
            <p class="mb-3 mt-8 px-3 text-xs font-semibold uppercase
                  tracking-wider text-slate-400">

                Administration

            </p>

            <div class="space-y-1">

                <!-- Categories -->
                <a th:href="@{/admin/categories}" class="group flex items-center gap-3 rounded-xl px-3 py-3
                      text-sm font-medium text-slate-600 transition
                      hover:bg-slate-50 hover:text-purple-700">

                    <svg class="h-5 w-5 text-slate-400 group-hover:text-purple-600" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2">

                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0
                             01-2 2H5a2 2 0 01-2-2v-6a2 2 0
                             012-2m14 0V9a2 2 0 00-2-2M5 11V9a2
                             2 0 012-2m0 0V5a2 2 0 012-2h6a2
                             2 0 012 2v2M7 7h10" />

                    </svg>

                    <span>Categories</span>

                </a>


                <!-- Registry -->
                <a th:href="@{/admin/catalog/registry}" class="group flex items-center gap-3 rounded-xl px-3 py-3
                      text-sm font-medium text-slate-600 transition
                      hover:bg-slate-50 hover:text-purple-700">

                    <svg class="h-5 w-5 text-slate-400 group-hover:text-purple-600" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2">

                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0
                             002 2h10a2 2 0 002-2V7a2 2 0
                             00-2-2h-2M9 5a3 3 0 006 0M9 5a2
                             2 0 012-2h2a2 2 0 012 2v2" />

                    </svg>

                    <span>Book copies</span>

                </a>


                <!-- Reports -->
                <a th:href="@{/reports}" class="group flex items-center gap-3 rounded-xl px-3 py-3
                      text-sm font-medium text-slate-600 transition
                      hover:bg-slate-50 hover:text-purple-700">

                    <svg class="h-5 w-5 text-slate-400 group-hover:text-purple-600" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2">

                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 19V9a2 2 0 012-2h2a2 2 0
                             012 2v10m-6 0a2 2 0 002 2h2a2
                             2 0 002-2m0 0V5a2 2 0 012-2h2a2
                             2 0 012 2v14a2 2 0 01-2 2h-2a2
                             2 0 01-2-2z" />

                    </svg>

                    <span>Reports</span>

                </a>

            </div>

        </nav>


        <!-- LOGOUT -->
        <div class="border-t border-slate-100 p-4">

            <form th:action="@{/logout}" method="post">

                <button type="submit" class="group flex w-full items-center gap-3 rounded-xl
                           px-3 py-3 text-sm font-medium text-slate-600
                           transition hover:bg-red-50 hover:text-red-600">

                    <svg class="h-5 w-5 text-slate-400 group-hover:text-red-500" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2">

                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3
                             3 0 01-3 3H6a3 3 0 01-3-3V7a3
                             3 0 013-3h4a3 3 0 013 3v1" />

                    </svg>

                    <span>Log out</span>

                </button>

            </form>

        </div>

    </div>

</body>

</html>
