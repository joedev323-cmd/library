<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Circulation</title>
    <link rel="stylesheet" th:href="@{/css/tailwind.css}">
  </head>

  <body class="bg-gray-100 min-h-screen flex">

    <aside
      class="w-64 bg-white shadow-md hidden md:flex flex-col justify-between">
      <div>
        <div class="p-6 border-b border-gray-100">
          <h1 class="text-2xl font-light text-gray-800 flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-purple-600 block"></span>
            Biblio<span class="font-semibold text-purple-600">Hub</span>
          </h1>
        </div>
        <nav class="p-4 space-y-1">
          <a th:href="@{/dashboard}"
            class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg text-gray-600 hover:bg-gray-50 hover:text-purple-600 transition ">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24"
              stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2V6z" />
            </svg>
            Dashboard
          </a>

          <a th:href="@{/Catalogue}"
            class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg text-gray-600 hover:bg-gray-50 hover:text-purple-600 transition">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24"
              stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
            </svg>
            Book Catalog
          </a>

          <a th:href="@{/circulation}"
            class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg bg-purple-50 text-purple-600 transition">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24"
              stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
            </svg>
            Issue / Returns
          </a>

          <a th:href="@{/members}"
            class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg text-gray-600 hover:bg-gray-50 hover:text-purple-600 transition">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24"
              stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.114-1.28.319-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
            Members
          </a>

          <a th:href="@{/reports}"
            class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg text-gray-600 hover:bg-gray-50 hover:text-purple-600 transition">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24"
              stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
            </svg>
            Reports
          </a>
        </nav>
      </div>

      <div class="p-4 border-t border-gray-100">
        <form th:action="@{/logout}" method="post">
          <button type="submit"
            class="w-full flex items-center gap-3 px-4 py-3 text-sm font-medium text-red-600 rounded-lg hover:bg-red-50 transition">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24"
              stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            Log Out
          </button>
        </form>
      </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0 overflow-x-hidden">

      <header
        class="bg-white shadow-sm h-16 flex items-center justify-between px-6 z-10">
        <div class="flex items-center gap-4">
          <h2
            class="text-xl font-semibold text-gray-800 md:block hidden">Circulation
            Desk</h2>
        </div>

        <div class="flex items-center gap-4">
          <div class="text-right hidden sm:block">
            <p class="text-sm font-medium text-gray-800"
              th:text="${#authentication.name}">Librarian</p>
            <p class="text-xs text-gray-500"
              th:text="${#strings.replace(#authentication.authorities[0].authority, 'ROLE_', '')}">Staff
              Dashboard</p>
          </div>
          <div
            class="w-10 h-10 rounded-full bg-purple-600 flex items-center justify-center text-white font-medium">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24"
              stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </div>
        </div>
      </header>

      <main class="p-6 space-y-6 flex-1 overflow-y-auto">
        <div id="notification-zone" class="space-y-3">

          <div th:if="${successMessage}"
            class="bg-green-50 border-l-4 border-green-500 rounded-r-xl p-4 flex items-start gap-3 shadow-sm">
            <div class="text-green-500 mt-0.5">
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2"><path
                  stroke-linecap="round" stroke-linejoin="round"
                  d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            </div>
            <div>
              <h4 class="text-sm font-semibold text-green-800">Transaction
                Successful</h4>
              <p class="text-sm text-green-700 mt-0.5"
                th:text="${successMessage}">Book issued successfully.</p>
            </div>
          </div>

          <div th:if="${errorMessage}"
            class="bg-amber-50 border-l-4 border-amber-500 rounded-r-xl p-4 flex items-start gap-3 shadow-sm">
            <div class="text-amber-500 mt-0.5">
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2"><path
                  stroke-linecap="round" stroke-linejoin="round"
                  d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            </div>
            <div>
              <h4 class="text-sm font-semibold text-amber-800">Transaction
                Failed</h4>
              <p class="text-sm text-amber-700 mt-0.5"
                th:text="${errorMessage}">Unable to complete checkout.</p>
            </div>
          </div>

        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div
            class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div
              class="px-6 py-5 border-b border-gray-100 flex items-center gap-3">
              <svg xmlns="http://www.w3.org/2000/svg"
                class="h-6 w-6 text-purple-600" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M12 19l7-7m0 0l-7-7m7 7H3" />
              </svg>
              <h3 class="font-medium text-gray-800 text-lg">Quick Checkout</h3>
            </div>

            <div class="p-6">
              <form th:action="@{/circulation/checkout}" method="post"
                class="space-y-4">
                <div>
                  <label
                    class="block text-sm font-medium text-gray-600 mb-1">Scan
                    Accession ID / Barcode</label>
                  <input type="text" name="accessionId"
                    class="w-full bg-gray-100 border border-gray-200 rounded px-4 py-3 text-base font-mono placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:bg-white transition"
                    placeholder="Focus here & scan..." autofocus required>
                </div>
                <div>
                  <label
                    class="block text-sm font-medium text-gray-600 mb-1">Borrower
                    ID</label>
                  <input type="text" name="borrowerId"
                    class="w-full bg-gray-100 border border-gray-200 rounded px-4 py-3 text-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:bg-white transition"
                    placeholder="Enter Borrower ID..." required>
                </div>
                <button type="submit"
                  class="w-full bg-purple-600 hover:bg-purple-700 text-white font-medium py-3 rounded-md mt-4 transition shadow-sm">
                  Complete Checkout
                </button>
              </form>
            </div>
          </div>

          <div
            class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div
              class="px-6 py-5 border-b border-gray-100 flex items-center gap-3">
              <svg xmlns="http://www.w3.org/2000/svg"
                class="h-6 w-6 text-purple-600" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M19 14l-7 7m0 0l-7-7m7 7V3" />
              </svg>
              <h3 class="font-medium text-gray-800 text-lg">Quick Return</h3>
            </div>
            <div class="p-6">
              <form th:action="@{/circulation/return}" method="post"
                class="space-y-4">
                <div>
                  <label
                    class="block text-sm font-medium text-gray-600 mb-1">Scan
                    Accession ID / Barcode to Return</label>
                  <input type="text" name="accessionId"
                    class="w-full bg-gray-100 border border-gray-200 rounded px-4 py-3 text-base font-mono placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:bg-white transition"
                    placeholder="Focus here & scan..." required>
                </div>
                <div>
                  <label
                    class="block text-sm font-medium text-gray-600 mb-1">Condition
                    Assessment</label>
                  <select name="condition"
                    class="w-full bg-gray-100 border border-gray-200 rounded px-4 py-3 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:bg-white transition">
                    <option value="Good">Good (No Change)</option>
                    <option value="New">New</option>
                    <option value="Damaged">Damaged (Assess Fine)</option>
                  </select>
                </div>
                <button type="submit"
                  class="w-full bg-purple-600 hover:bg-purple-700 text-white font-medium py-3 rounded-md mt-4 transition shadow-sm">
                  Process Return
                </button>
              </form>
            </div>
          </div>
        </div>

      </main>
    </div>

    <script>
      function mockAction(event, actionType) {
        event.preventDefault(); 
        
        document.getElementById('alert-success').classList.add('hidden');
        document.getElementById('alert-error').classList.add('hidden');
        document.getElementById('alert-fine').classList.add('hidden');

        if (actionType === 'checkout') {
          if (Math.random() > 0.3) {
            document.getElementById('alert-success').classList.remove('hidden');
          } else {
            document.getElementById('alert-error').classList.remove('hidden');
          }
        } else if (actionType === 'return') {
          const selection = document.getElementById('conditionAssessment').value;
          if (selection === 'Damaged') {
            document.getElementById('alert-fine').classList.remove('hidden');
          } else {
            document.getElementById('alert-success').classList.remove('hidden');
          }
        }

        event.target.reset(); 
      }
    </script>
  </body>
</html>
