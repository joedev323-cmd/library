<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Edit Book - BiblioHub</title>
        <link rel="stylesheet" th:href="@{/css/tailwind.css}">
    </head>

    <body class="bg-gray-100 min-h-screen flex">

        <aside
            class="w-64 bg-white shadow-md hidden md:flex flex-col justify-between">
            <div>
                <div class="p-6 border-b border-gray-100">
                    <h1
                        class="text-2xl font-light text-gray-800 flex items-center gap-2">
                        <span
                            class="w-3 h-3 rounded-full bg-purple-600 block"></span>
                        Biblio<span
                            class="font-semibold text-purple-600">Hub</span>
                    </h1>
                </div>

                <nav class="p-4 space-y-1">
                    <a th:href="@{/dashboard}"
                        class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg text-gray-600 hover:bg-gray-50 hover:text-purple-600 transition">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2V6z" />
                        </svg>
                        Dashboard
                    </a>

                    <a th:href="@{/Catalogue}"
                        class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg bg-purple-50 text-purple-600 transition">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                        </svg>
                        Book Catalog
                    </a>

                    <a th:href="@{/circulation}"
                        class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg text-gray-600 hover:bg-gray-50 hover:text-purple-600 transition">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
                        </svg>
                        Issue / Returns
                    </a>

                    <a th:href="@{/members}"
                        class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg text-gray-600 hover:bg-gray-50 hover:text-purple-600 transition">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.114-1.28.319-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                        </svg>
                        Members
                    </a>

                    <a th:href="@{/reports}"
                        class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg text-gray-600 hover:bg-gray-50 hover:text-purple-600 transition">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                        </svg>
                        Reports
                    </a>
                </nav>
            </div>

            <div class="p-4 border-t border-gray-100">
                <form th:action="@{/logout}" method="post">
                    <button type="submit"
                        class="w-full flex items-center gap-3 px-4 py-3 text-sm font-medium text-red-600 rounded-lg hover:bg-red-50 transition">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                        Log Out
                    </button>
                </form>
            </div>
        </aside>

        <div class="flex-1 flex flex-col min-w-0 overflow-x-hidden">

            <header
                class="bg-white shadow-sm h-16 flex items-center justify-between px-6 z-10">
                <div class="flex items-center gap-4">
                    <h2
                        class="text-xl font-semibold text-gray-800 md:block hidden">Asset
                        Modifications</h2>
                </div>

                <div class="flex items-center gap-4">
                    <div class="text-right hidden sm:block">
                        <p class="text-sm font-medium text-gray-800"
                            th:text="${#authentication != null ? #authentication.name : 'Librarian'}">Librarian</p>
                        <p class="text-xs text-gray-500">Staff Workspace</p>
                    </div>
                    <div
                        class="w-10 h-10 rounded-full bg-purple-600 flex items-center justify-center text-white font-medium">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </div>
                </div>
            </header>

            <main
                class="p-6 space-y-6 flex-1 overflow-y-auto max-w-4xl w-full mx-auto">

                <div class="flex items-center justify-between">
                    <a th:href="@{/Catalogue}"
                        class="inline-flex items-center text-sm font-medium text-gray-500 hover:text-purple-600 transition gap-1.5">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M15 19l-7-7 7-7" />
                        </svg>
                        Back to Catalog List
                    </a>
                </div>

                <div
                    class="bg-white rounded-xl shadow-sm border border-gray-100 p-8">
                    <div class="border-b border-gray-100 pb-5 mb-6">
                        <h3 class="text-xl font-semibold text-gray-800">Edit
                            Catalog Metadata</h3>
                        <p class="text-sm text-gray-500 mt-1">Modify core
                            metadata properties for this global collection
                            master record.</p>
                    </div>

                    <form
                        th:action="@{/Catalogue/update/{isbn}(isbn=${item.isbn})}"
                        th:object="${item}" method="POST" class="space-y-5">

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div>
                                <label
                                    class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1.5">Book
                                    Title</label>
                                <input type="text" th:field="*{title}"
                                    class="w-full bg-white border border-gray-200 rounded px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 transition text-gray-800"
                                    placeholder="Enter item title..." required>
                            </div>

                            <div>
                                <label
                                    class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1.5">Author</label>
                                <input type="text" th:field="*{author}"
                                    class="w-full bg-white border border-gray-200 rounded px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 transition text-gray-800"
                                    placeholder="Enter author name..." required>
                            </div>
                        </div>

                        <div>
                            <label
                                class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1.5">International
                                Standard Book Number (ISBN)</label>
                            <input type="text" th:field="*{isbn}"
                                class="w-full bg-white border border-gray-200 rounded px-4 py-3 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-purple-500 transition text-gray-800"
                                placeholder="e.g., 9780141182605" required>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div>
                                <label
                                    class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1.5">Publisher</label>
                                <input type="text" th:field="*{publisher}"
                                    class="w-full bg-white border border-gray-200 rounded px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 transition text-gray-800"
                                    placeholder="Enter publisher...">
                            </div>

                            <div>
                                <label
                                    class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1.5">Edition</label>
                                <input type="text" th:field="*{edition}"
                                    class="w-full bg-white border border-gray-200 rounded px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 transition text-gray-800"
                                    placeholder="e.g., 3rd Edition">
                            </div>
                        </div>

                        <div>
                            <label
                                class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1.5">Asset
                                Description / Book Summary</label>
                            <textarea th:field="*{description}" rows="4"
                                class="w-full bg-white border border-gray-200 rounded px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 transition text-gray-800"
                                placeholder="Enter book summary or catalog registry notes..."></textarea>
                        </div>

                        <div>
                            <label
                                class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1.5">Assigned
                                Categories</label>
                            <div
                                class="border border-gray-200 rounded p-4 max-h-48 overflow-y-auto space-y-2 bg-gray-50/50">
                                <div th:each="cat : ${categories}"
                                    class="flex items-center gap-3">
                                    <input type="checkbox"
                                        th:field="*{categories}"
                                        th:value="${cat.categoryId}"
                                        class="w-4 h-4 text-purple-600 border-gray-300 rounded focus:ring-purple-500">
                                    <label th:for="${#ids.prev('categories')}"
                                        class="text-sm text-gray-700 font-medium select-none"
                                        th:text="${cat.name}">Category
                                        Name</label>
                                </div>
                                <div th:if="${#lists.isEmpty(categories)}"
                                    class="text-sm text-gray-400 italic">
                                    No system categories configured.
                                </div>
                            </div>
                        </div>

                        <div
                            class="flex justify-end gap-3 pt-4 border-t border-gray-100 mt-8">
                            <a th:href="@{/Catalogue}"
                                class="inline-flex items-center justify-center bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium px-5 py-2.5 rounded-lg text-sm transition shadow-sm">
                                Cancel Changes
                            </a>
                            <button type="submit"
                                class="inline-flex items-center justify-center bg-purple-600 hover:bg-purple-700 text-white font-medium px-5 py-2.5 rounded-lg text-sm transition shadow-sm">
                                Save Modifications
                            </button>
                        </div>
                    </form>
                </div>

            </main>
        </div>

    </body>
</html>
