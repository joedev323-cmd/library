spring.application.name=libback
server.port=9090

# Separate H2 testing database
spring.datasource.url=jdbc:h2:file:./data/bibliodb_migrations
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway migrations
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/h2migration

# Hibernate validates; Flyway manages schema changes
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# MailHog SMTP server
spring.mail.host=localhost
spring.mail.port=1025


spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Prevent indefinite SMTP connection delays
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000